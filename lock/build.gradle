plugins {
    id 'com.android.application'
}

// Keystore passwords live with the keystore in secrets/ (git-ignored), not in this public file.
def signing = new Properties()
def signingFile = rootProject.file('secrets/signing.properties')
if (signingFile.exists()) signingFile.withInputStream { signing.load(it) }

android {
    namespace 'home.phonelock'
    compileSdk 37

    defaultConfig {
        applicationId 'home.phonelock'
        minSdk 33
        targetSdk 36
        versionCode rootProject.ext.gitVersionCode
        versionName "1.0.${rootProject.ext.gitVersionCode}"
    }

    signingConfigs {
        // Our own key, kept with the project so future updates install over the top.
        lock {
            storeFile file('../secrets/phonelock.keystore')
            storePassword signing.getProperty('storePassword')
            keyAlias 'phonelock'
            keyPassword signing.getProperty('keyPassword')
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.lock
        }
        debug {
            signingConfig signingConfigs.lock
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

// The lock app is plain Java. AGP 9 compiles Kotlin in every module and adds the Kotlin standard library
// (2 MB), which this app never uses, so leave it out: smaller downloads for setup and self-updates.
// Only the app's own classpaths: build tools such as lint still need it.
configurations.matching { it.name.endsWith('RuntimeClasspath') || it.name.endsWith('CompileClasspath') }.configureEach {
    exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib'
}
