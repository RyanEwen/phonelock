# Site config for the host's shared nginx container. tools/deploy-hub.sh installs it as
# conf.d/phonelock.conf with __DOMAIN__ replaced by PHONELOCK_DOMAIN from .env.
# TLS ends at Cloudflare (proxied DNS); traffic reaches nginx over HTTP:80.

server {
    server_name __DOMAIN__;
    listen 80;

    # This site's own access log on the host, rotated daily and kept for 14 days (host logrotate).
    # The shared nginx turns its default log off, so a site without this line logs nothing.
    access_log /var/log/nginx/sites/phonelock.access.log main;

    # Docker's embedded DNS, so the upstream resolves even if the hub restarts.
    resolver 127.0.0.11 valid=30s;

    # The visitor's address is taken from CF-Connecting-IP only when the request really comes from
    # Cloudflare (ranges from https://www.cloudflare.com/ips/, 2026-11-10); anyone reaching the server
    # directly is identified by their own address, so ntfy's per-visitor limits can't be dodged.
    set_real_ip_from 173.245.48.0/20;
    set_real_ip_from 103.21.244.0/22;
    set_real_ip_from 103.22.200.0/22;
    set_real_ip_from 103.31.4.0/22;
    set_real_ip_from 141.101.64.0/18;
    set_real_ip_from 108.162.192.0/18;
    set_real_ip_from 190.93.240.0/20;
    set_real_ip_from 188.114.96.0/20;
    set_real_ip_from 197.234.240.0/22;
    set_real_ip_from 198.41.128.0/17;
    set_real_ip_from 162.158.0.0/15;
    set_real_ip_from 104.16.0.0/13;
    set_real_ip_from 104.24.0.0/14;
    set_real_ip_from 172.64.0.0/13;
    set_real_ip_from 131.0.72.0/22;
    set_real_ip_from 2400:cb00::/32;
    set_real_ip_from 2606:4700::/32;
    set_real_ip_from 2803:f800::/32;
    set_real_ip_from 2405:b500::/32;
    set_real_ip_from 2405:8100::/32;
    set_real_ip_from 2a06:98c0::/29;
    set_real_ip_from 2c0f:f248::/32;
    real_ip_header CF-Connecting-IP;

    # ntfy streams subscriptions as long-lived responses: no buffering, long timeouts.
    proxy_buffering off;
    proxy_request_buffering off;
    client_max_body_size 52m;

    # Only what the PhoneLock apps use: health, attachments, and topics shaped like PhoneLock's
    # (two letters, a dash, 16 to 40 lowercase letters or digits), alone or comma-separated, plain or /json. Everything
    # else (other topic names, ntfy's web and account APIs) is refused, so the hub isn't a general relay.
    location = /v1/health { include /etc/nginx/conf.d/phonelock.proxy; }
    location /file/ { include /etc/nginx/conf.d/phonelock.proxy; }
    location ~ "^/[a-z]{2}-[a-z0-9]{16,40}(,[a-z]{2}-[a-z0-9]{16,40})*(/json)?$" {
        include /etc/nginx/conf.d/phonelock.proxy;
    }
    location / { return 404; }
}
