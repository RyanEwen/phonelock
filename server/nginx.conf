# Site config for the host's shared nginx container. tools/deploy-hub.sh installs it as
# conf.d/phonelock.conf with __DOMAIN__ replaced by PHONELOCK_DOMAIN from .env.
# TLS ends at Cloudflare (proxied DNS); traffic reaches nginx over HTTP:80.

server {
    server_name __DOMAIN__;
    listen 80;

    # Docker's embedded DNS, so the upstream resolves even if the hub restarts.
    resolver 127.0.0.11 valid=30s;

    # ntfy streams subscriptions as long-lived responses: no buffering, long timeouts.
    proxy_buffering off;
    proxy_request_buffering off;
    client_max_body_size 3m;

    location / {
        set $upstream phonelock-hub;
        proxy_pass http://$upstream:80;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        # The real visitor address from Cloudflare, for ntfy's per-visitor limits.
        proxy_set_header X-Forwarded-For $http_cf_connecting_ip;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
        proxy_redirect off;
    }
}
