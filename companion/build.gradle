plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'org.jetbrains.kotlin.plugin.compose'
}

android {
    namespace 'home.phonelock.parent'
    compileSdk 36

    defaultConfig {
        applicationId 'home.phonelock.parent'
        minSdk 33
        targetSdk 36
        versionCode 1
        versionName '1.0'
    }

    signingConfigs {
        lock {
            storeFile file('../secrets/phonelock.keystore')
            storePassword 'phonelock'
            keyAlias 'phonelock'
            keyPassword 'phonelock'
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.lock
        }
        debug { signingConfig signingConfigs.lock }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions { jvmTarget = '17' }
    buildFeatures { compose true }
}

dependencies {
    def bom = platform('androidx.compose:compose-bom:2025.05.01')
    implementation bom
    implementation 'androidx.compose.ui:ui'
    implementation 'androidx.compose.material3:material3'
    implementation 'androidx.compose.material:material-icons-core'
    implementation 'androidx.activity:activity-compose:1.10.1'
    // In-app QR scanning (approved: ML Kit + CameraX)
    def camerax = '1.4.2'
    implementation "androidx.camera:camera-camera2:$camerax"
    implementation "androidx.camera:camera-lifecycle:$camerax"
    implementation "androidx.camera:camera-view:$camerax"
    implementation 'com.google.mlkit:barcode-scanning:17.3.0'
    // Drawing setup and pairing QR codes (approved: ZXing core)
    implementation 'com.google.zxing:core:3.5.4'
}
